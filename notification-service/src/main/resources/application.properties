spring.application.name=notification-service

spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5434/notificationdb}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.bankflow.notification.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.bankflow.notification.event.TransferCompletedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false